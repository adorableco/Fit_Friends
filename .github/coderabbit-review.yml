# @format

name: Coderabbit Review
on:
  schedule:
    - cron: "*/* 1 * *" # 1시간마다 실행
  pull_request:
    types: [opened, reopened]
jobs:
  coderabbit-review:
    runs-on: [ubuntu-latest]
    steps:
      - name: Review
        uses: adorableco/Fit_Friends@coderabbit-action
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
